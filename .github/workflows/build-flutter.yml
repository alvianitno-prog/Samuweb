name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        required: true
      userId:
        required: true
      payload:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ── 1. Parse payload ────────────────────────────────────────────────────
      - name: Parse payload
        id: parse
        run: |
          echo '${{ inputs.payload }}' > payload.json
          echo "mode=$(jq -r '.mode // "zip"' payload.json)"           >> $GITHUB_OUTPUT
          echo "url=$(jq -r '.url // ""' payload.json)"                >> $GITHUB_OUTPUT
          echo "build_type=$(jq -r '.buildType // "release"' payload.json)" >> $GITHUB_OUTPUT
          echo "app_name=$(jq -r '.appName // "MyApp"' payload.json)"  >> $GITHUB_OUTPUT
          echo "icon_url=$(jq -r '.iconUrl // ""' payload.json)"       >> $GITHUB_OUTPUT

      # ── 2. Setup Java & Flutter (Stable Terbaru) ───────────────────────────
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ════════════════════════════════════════════════════════════════════════
      # MODE ZIP — Build dari project Flutter yang diupload user
      # ════════════════════════════════════════════════════════════════════════
      - name: "[ZIP] Download & extract project"
        if: steps.parse.outputs.mode == 'zip'
        run: |
          wget -q -O project.zip "${{ steps.parse.outputs.url }}"
          unzip -q project.zip -d project

      - name: "[ZIP] Find Flutter root"
        if: steps.parse.outputs.mode == 'zip'
        id: root_zip
        run: |
          DIR=$(find project -name "pubspec.yaml" -maxdepth 5 | head -1 | xargs dirname)
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      # ── AUTO ADJUSTMENT: Kompatibilitas Universal (Support Semua Versi) ──────
      - name: "[ZIP] Auto-adjust build configs & SDK constraints"
        if: steps.parse.outputs.mode == 'zip'
        working-directory: ${{ steps.root_zip.outputs.dir }}
        run: |
          ANDROID_DIR="android"

          # ── 1. Gradle Wrapper → Upgrade ke 8.14 (Mendukung Flutter Stable Terbaru) ──
          WRAPPER="$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER" ]; then
            sed -i 's|gradle-[0-9][0-9.]*-[a-z]*\.zip|gradle-8.14-bin.zip|g' "$WRAPPER"
            echo "[OK] Gradle wrapper → 8.14"
          fi

          # ── 2. Handle Groovy (build.gradle) & Kotlin Script (build.gradle.kts) ──
          APP_GRADLE=""
          if [ -f "$ANDROID_DIR/app/build.gradle" ]; then
            APP_GRADLE="$ANDROID_DIR/app/build.gradle"
          elif [ -f "$ANDROID_DIR/app/build.gradle.kts" ]; then
            APP_GRADLE="$ANDROID_DIR/app/build.gradle.kts"
          fi

          MIN_SDK=34
          MAX_SDK=35
          if [ -n "$APP_GRADLE" ]; then
            CURRENT=$(grep -oP '(?<=compileSdk\s)[0-9]+|(?<=compileSdkVersion\s)[0-9]+|(?<=compileSdk\s=\s)[0-9]+' "$APP_GRADLE" | head -1)
            CURRENT=${CURRENT:-0}

            if [ "$CURRENT" -lt "$MIN_SDK" ]; then
              TARGET_SDK=$MAX_SDK
            elif [ "$CURRENT" -gt "$MAX_SDK" ]; then
              TARGET_SDK=$MAX_SDK
            else
              TARGET_SDK=$CURRENT
            fi

            # Update compileSdk / targetSdk untuk Groovy maupun KTS
            sed -i "s/compileSdkVersion\s\+[0-9]\+/compileSdkVersion $TARGET_SDK/g" "$APP_GRADLE"
            sed -i "s/compileSdk\s\+[0-9]\+/compileSdk $TARGET_SDK/g"               "$APP_GRADLE"
            sed -i "s/compileSdk\s*=\s*[0-9]\+/compileSdk = $TARGET_SDK/g"          "$APP_GRADLE"
            sed -i "s/targetSdkVersion\s\+[0-9]\+/targetSdkVersion $TARGET_SDK/g"   "$APP_GRADLE"
            sed -i "s/targetSdk\s\+[0-9]\+/targetSdk $TARGET_SDK/g"                 "$APP_GRADLE"
            sed -i "s/targetSdk\s*=\s*[0-9]\+/targetSdk = $TARGET_SDK/g"            "$APP_GRADLE"

            # Compatibility Java 17
            sed -i 's/JavaVersion\.VERSION_1_[0-9]\+/JavaVersion.VERSION_17/g' "$APP_GRADLE"
            sed -i 's/JavaVersion\.VERSION_[0-9]\+/JavaVersion.VERSION_17/g'   "$APP_GRADLE"
            echo "[OK] $APP_GRADLE updated → SDK: $TARGET_SDK, Java: 17"
          fi

          # ── 3. Fix pubspec.yaml SDK Bounds ─────────────────────────────────
          PUBSPEC="pubspec.yaml"
          if [ -f "$PUBSPEC" ]; then
            sed -i -E "s/sdk:\s*['\"][^'\"]*['\"]/sdk: '>=3.0.0 <4.0.0'/g" "$PUBSPEC"
            echo "[OK] Adjusted pubspec sdk constraint to '>=3.0.0 <4.0.0'"
          fi

      - name: "[ZIP] Flutter pub get"
        if: steps.parse.outputs.mode == 'zip'
        working-directory: ${{ steps.root_zip.outputs.dir }}
        run: flutter pub get || flutter pub upgrade --major-versions

      - name: "[ZIP] Build APK"
        if: steps.parse.outputs.mode == 'zip'
        working-directory: ${{ steps.root_zip.outputs.dir }}
        run: flutter build apk --${{ steps.parse.outputs.build_type }} --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: "[ZIP] Upload APK artifact"
        if: steps.parse.outputs.mode == 'zip'
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: ${{ steps.root_zip.outputs.dir }}/build/app/outputs/flutter-apk/*.apk
          retention-days: 1

      # ════════════════════════════════════════════════════════════════════════
      # MODE URL — Web2APK: wrap website ke dalam Flutter WebView APK
      # ════════════════════════════════════════════════════════════════════════
      - name: "[URL] Create Flutter WebView project"
        if: steps.parse.outputs.mode == 'url'
        run: |
          flutter create --org com.gojocrasher --project-name webview_app webview_project
          cd webview_project
          flutter pub add webview_flutter

      - name: "[URL] Patch main.dart"
        if: steps.parse.outputs.mode == 'url'
        run: |
          cat > webview_project/lib/main.dart << 'DART'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() => runApp(const MyApp());

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                title: '${{ steps.parse.outputs.app_name }}',
                home: const WebViewPage(),
              );
            }
          }

          class WebViewPage extends StatefulWidget {
            const WebViewPage({super.key});
            @override
            State<WebViewPage> createState() => _WebViewPageState();
          }

          class _WebViewPageState extends State<WebViewPage> {
            late final WebViewController _controller;
            @override
            void initState() {
              super.initState();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..loadRequest(Uri.parse('${{ steps.parse.outputs.url }}'));
            }
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(child: WebViewWidget(controller: _controller)),
              );
            }
          }
          DART

      - name: "[URL] Patch app name"
        if: steps.parse.outputs.mode == 'url'
        run: |
          APP="${{ steps.parse.outputs.app_name }}"
          sed -i "s/android:label=\"[^\"]*\"/android:label=\"${APP}\"/" \
            webview_project/android/app/src/main/AndroidManifest.xml

      - name: "[URL] Download & apply custom icon"
        if: steps.parse.outputs.mode == 'url' && steps.parse.outputs.icon_url != ''
        run: |
          wget -q -O icon_raw "${{ steps.parse.outputs.icon_url }}"
          sudo apt-get install -y imagemagick -q
          for size in 48 72 96 144 192; do
            case $size in
              48)  dir="mipmap-mdpi"    ;;
              72)  dir="mipmap-hdpi"    ;;
              96)  dir="mipmap-xhdpi"   ;;
              144) dir="mipmap-xxhdpi"  ;;
              192) dir="mipmap-xxxhdpi" ;;
            esac
            TARGET="webview_project/android/app/src/main/res/${dir}"
            mkdir -p "$TARGET"
            convert icon_raw -resize ${size}x${size} "$TARGET/ic_launcher.png"
          done

      - name: "[URL] Flutter pub get"
        if: steps.parse.outputs.mode == 'url'
        working-directory: webview_project
        run: flutter pub get

      - name: "[URL] Build APK"
        if: steps.parse.outputs.mode == 'url'
        working-directory: webview_project
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: "[URL] Upload APK artifact"
        if: steps.parse.outputs.mode == 'url'
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: webview_project/build/app/outputs/flutter-apk/*.apk
          retention-days: 1
